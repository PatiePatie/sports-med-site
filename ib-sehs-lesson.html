<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="icons/vitalite-32.png">
<title>IB SEHS · Chapter 1 focus lesson</title>

<!-- Auth only. This page loads NO site chrome: no sidebar, top bar, FAB, modal or
     layout script. auth-gate.js is kept so a signed-out visitor still signs in. -->
<script src="auth-gate.js?v=2"></script>


<!-- The site's own theme, so fonts, colours and dark mode are IDENTICAL to the
     course page instead of a hand-copied approximation. These are stylesheets
     only: nothing here mounts a sidebar or a top bar. linear-layout.js,
     sections.js, auth-widget, qna, notif-bell and tutorial-widget stay OUT. -->
<link rel="stylesheet" href="gold-blue-theme.css?v=15">
<link rel="stylesheet" href="vitalite-skin.css?v=21">
<link rel="stylesheet" href="phone.css?v=1">

<!-- The carpet texture and the cursor feel. soft-fx.js has the cursor tracking
     switched off site-wide (you asked for the texture without it), so these
     give the same fabric background the course page has. -->
<link rel="stylesheet" href="shapes-skin.css?v=3">
<link rel="stylesheet" href="soft-glass.css?v=12">
<script src="shapes-fx.js?v=6" defer></script>
<script src="soft-fx.js?v=11" defer></script>
<script src="button-glow.js?v=1" defer></script>

<link rel="stylesheet" href="knowledge.css?v=6">
<link rel="stylesheet" href="ib-sehs-lesson.css?v=8">

<!-- Course data, the same files the normal page loads. Read-only here. -->
<script src="ib-sehs-data.js?v=4"></script>
<script src="ib-sehs-native.js?v=3"></script>
<script src="ib-sehs-deep.js?v=12"></script>
<script src="ib-sehs-visuals.js?v=5"></script>
<!-- The designed interactive models. knowledge-fx.js is deliberately NOT loaded:
     it mounts a practice tray onto every .native-section, and the figure slides
     need that class purely so the model layer can find them. -->
<script src="ib-sehs-models.js?v=16" defer></script>

<!-- The course page's own content renderer. The study guide reuses it so the
     29 sections' real text, figures and interactive models are reachable from
     here; it is stylesheet-and-data only on this page and mounts no chrome.
     Deferred because it touches document.body at load. -->
<script src="ib-sehs-course.js?v=19" defer></script>

<!-- the authored layer: one summary + one analogy + one example per section -->
<script src="ib-sehs-lesson-data.js?v=3"></script>

<script src="ib-sehs-lesson.js?v=8" defer></script>
</head>

<body class="ib-lesson">

<header class="ib-top">
  <!-- A focused player: one ✕ to leave, one progress bar, and the tools. The
       reference reader has no "back to topics" here either — the rail's
       "← All topics" already does that job. -->
  <button class="ib-top__exit ib-top__exit--x" id="ibExit" type="button"
          aria-label="Exit lesson" data-en="Exit" data-zh="退出">✕</button>
  <button class="ib-top__btn ib-top__btn--rail" id="ibRailToggle" type="button"
          aria-label="Sections and glossary" data-en="Sections &amp; terms" data-zh="小节与术语">☰</button>

  <div class="ib-top__bar" role="progressbar" aria-label="Lesson progress"><div class="ib-top__fill" id="ibFill"></div></div>
  <span class="ib-top__count" id="ibCount">—</span>

  <button class="ib-top__btn" id="ibDrill" type="button" aria-pressed="false"
          data-en="Test me" data-zh="自测模式">Test me</button>
  <button class="ib-top__btn" id="ibLang" type="button" aria-label="Language">EN</button>
  <button class="ib-top__btn" id="ibDark" type="button" aria-label="Dark mode">☾</button>
</header>

<div class="ib-rail__scrim" id="ibScrim"></div>

<!-- ── hub ─────────────────────────────────────────────────────────────── -->
<div class="ib-hub" id="ibHub"><div class="ib-pane-min-height"></div></div>

<!-- ── reader ──────────────────────────────────────────────────────────── -->
<div class="ib-lesson-shell" id="ibReader">
  <aside class="ib-rail" id="ibRail" aria-label="Sections and glossary">
    <button class="ib-rail__close" id="ibRailClose" type="button" aria-label="Close">×</button>
    <button class="ib-rail__hub" id="ibRailHub" type="button">
      <span data-en="← All topics" data-zh="← 全部主题">← All topics</span>
    </button>
    <p class="ib-rail__head" data-en="Sections" data-zh="小节">Sections</p>
    <ul class="ib-map" id="ibMap"></ul>
    <p class="ib-rail__head" data-en="Your glossary" data-zh="我的术语表">Your glossary</p>
    <ul class="ib-gloss__list" id="ibGloss"></ul>
  </aside>
  <main class="ib-read" id="ibRead"></main>
</div>

<footer class="ib-foot" id="ibFoot" hidden>
  <button class="ib-foot__btn ib-foot__btn--back" id="ibBack" type="button"
          aria-label="Previous block"><span aria-hidden="true">←</span></button>
  <span class="ib-foot__spacer"></span>
  <button class="ib-foot__btn ib-foot__btn--next" id="ibNext" type="button">
    <span data-en="Next" data-zh="下一句">Next</span>
    <span class="ib-foot__arrow" aria-hidden="true">→</span>
  </button>
</footer>

</body>
</html>
