<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="icons/vitalite-32.png">
<title>IB SEHS Visual Revision Workbook — Vitalité</title>
<meta name="robots" content="noindex,follow">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--wb-bg:#e8eef4;--wb-paper:#fff;--wb-ink:#0c2241;--wb-muted:#4c6078;--wb-line:#cfdae5;--wb-blue:#0f376e;--wb-blue2:#215ea4;--wb-red:#b4232f;--wb-green:#24745a;--wb-gold:#d4a72c;--wb-shadow:0 16px 42px rgba(12,34,65,.12);--wb-font:"Avenir Next","Helvetica Neue",Arial,"Songti SC","SimSun",sans-serif;--wb-serif:"Cormorant Garamond",Georgia,"Songti SC",serif}
body{font-family:var(--wb-font);background:var(--wb-bg);color:var(--wb-ink);line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact}.wb-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.55rem;padding:.7rem max(1rem,calc((100vw - 1180px)/2));background:color-mix(in srgb,var(--wb-paper) 92%,transparent);border-bottom:1px solid var(--wb-line);backdrop-filter:blur(14px)}.wb-brand{min-width:0;flex:1}.wb-brand strong{display:block;font-family:var(--wb-serif);font-size:1.15rem;line-height:1.1}.wb-brand span{display:block;color:var(--wb-muted);font-size:.72rem}.wb-mode{display:flex;flex-wrap:wrap;gap:.3rem}.wb-btn,.wb-mode button{min-height:36px;padding:.48rem .72rem;border:1px solid var(--wb-line);border-radius:9px;background:var(--wb-paper);color:var(--wb-ink);font:inherit;font-size:.76rem;font-weight:800;text-decoration:none;cursor:pointer;white-space:nowrap}.wb-btn:hover,.wb-mode button:hover{text-decoration:none;box-shadow:0 5px 15px rgba(12,34,65,.1)}.wb-btn.primary,.wb-mode button.active{background:var(--wb-blue);border-color:var(--wb-blue);color:#fff}.wb-intro{max-width:1180px;margin:1.25rem auto;padding:0 1rem}.wb-intro-card{border:1px solid var(--wb-line);border-radius:16px;background:var(--wb-paper);padding:1rem 1.1rem;box-shadow:var(--wb-shadow)}.wb-intro-card h1{font-family:var(--wb-serif);font-size:2rem;line-height:1.1;margin-bottom:.35rem}.wb-intro-card p{color:var(--wb-muted);font-size:.86rem}.wb-stats{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}.wb-stat{padding:.3rem .58rem;border-radius:999px;background:color-mix(in srgb,var(--wb-blue2) 10%,var(--wb-paper));color:var(--wb-blue2);font-size:.72rem;font-weight:800}.wb-book{width:min(1180px,calc(100% - 2rem));margin:0 auto 2rem}.wb-sheet{min-height:760px;margin:0 0 1.2rem;padding:1.2rem;border:1px solid var(--wb-line);border-top:8px solid var(--theme);border-radius:18px;background:var(--wb-paper);box-shadow:var(--wb-shadow);break-after:page;page-break-after:always}.wb-sheet:last-child{break-after:auto;page-break-after:auto}.wb-sheet-head{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:.85rem;align-items:center;padding-bottom:.8rem;border-bottom:2px solid var(--wb-line)}.wb-theme{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;background:var(--theme);color:#fff;font-family:var(--wb-serif);font-size:2.4rem;font-weight:800}.wb-title h2{font-family:var(--wb-serif);font-size:1.75rem;line-height:1.05}.wb-title p{color:var(--wb-muted);font-size:.88rem}.wb-code{text-align:right}.wb-code strong{display:block;color:var(--theme);font-size:1.15rem}.wb-code span{display:block;color:var(--wb-muted);font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.wb-section-label{margin:.8rem 0 .4rem;color:var(--wb-blue2);font-size:.67rem;font-weight:900;text-transform:uppercase;letter-spacing:.09em}.wb-ess{border:1px solid var(--wb-line);border-radius:12px;overflow:hidden}.wb-ess-row{display:grid;grid-template-columns:1fr 1fr}.wb-ess-row:nth-child(odd){background:color-mix(in srgb,var(--wb-blue2) 5%,var(--wb-paper))}.wb-ess-en,.wb-ess-zh{padding:.62rem .7rem;font-size:.79rem}.wb-ess-zh{border-left:1px solid var(--wb-line);color:var(--wb-muted)}.wb-ess-row>div:first-child::before{content:"";display:inline-block;width:7px;height:7px;margin:0 .45rem .05rem 0;border-radius:50%;background:var(--theme)}.wb-bottom{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-top:.7rem}.wb-box{padding:.72rem .8rem;border:1px solid var(--wb-line);border-radius:12px;background:var(--wb-paper)}.wb-box h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.35rem}.wb-box p{color:var(--wb-muted);font-size:.78rem}.wb-box.warn{border-color:color-mix(in srgb,var(--wb-red) 35%,var(--wb-line));background:color-mix(in srgb,var(--wb-red) 6%,var(--wb-paper))}.wb-box.warn h3{color:var(--wb-red)}.wb-check{margin-top:.7rem;padding:.72rem .8rem;border:1px dashed var(--wb-blue2);border-radius:12px;background:color-mix(in srgb,var(--wb-blue2) 5%,var(--wb-paper));font-size:.79rem}.wb-check strong{color:var(--wb-blue2)}.wb-rating{display:grid;grid-template-columns:auto repeat(3,1fr);gap:.4rem;align-items:center;margin-top:.7rem;padding-top:.65rem;border-top:1px solid var(--wb-line);font-size:.68rem;font-weight:800}.wb-rating span:not(:first-child){text-align:center;padding:.3rem;border:1px solid var(--wb-line);border-radius:7px}.wb-footer{display:flex;justify-content:space-between;gap:1rem;margin-top:.75rem;padding-top:.5rem;border-top:1px solid var(--wb-line);color:var(--wb-muted);font-size:.62rem}.mode-en .wb-zh,.mode-zh .wb-en{display:none!important}@media(max-width:700px){.wb-bar{align-items:flex-start;flex-wrap:wrap}.wb-brand{flex-basis:100%}.wb-sheet{min-height:auto;padding:.9rem}.wb-sheet-head{grid-template-columns:52px 1fr}.wb-theme{width:48px;height:48px;font-size:1.8rem}.wb-code{grid-column:2;text-align:left}.wb-ess-row,.wb-bottom{grid-template-columns:1fr}.wb-ess-zh{border-left:0;border-top:1px solid var(--wb-line)}.wb-rating{grid-template-columns:1fr 1fr}}
@page{size:A4 portrait;margin:9mm}@media print{html,body{background:#fff!important;color:#0c2241!important;font-size:9.3pt}.wb-bar,.wb-intro{display:none!important}.wb-book{width:auto;margin:0}.wb-sheet{width:192mm;min-height:277mm;height:277mm;margin:0;padding:7mm;border:0;border-top:2.4mm solid var(--theme);border-radius:0;box-shadow:none;overflow:hidden;break-after:page;page-break-after:always}.wb-sheet:last-child{break-after:auto;page-break-after:auto}.wb-title h2{font-size:18pt}.wb-title p{font-size:8.5pt}.wb-theme{width:14mm;height:14mm;font-size:21pt}.wb-section-label{margin:2.3mm 0 1.2mm;font-size:6.4pt}.wb-ess-row>div{padding:1.6mm 2mm;font-size:7.6pt;line-height:1.35}.wb-bottom{gap:1.5mm;margin-top:1.7mm}.wb-box{padding:1.7mm 2mm}.wb-box h3{font-size:6.3pt}.wb-box p{font-size:7.2pt}.wb-check{margin-top:1.7mm;padding:1.7mm 2mm;font-size:7.2pt}.wb-rating{margin-top:1.7mm;padding-top:1.5mm;font-size:6.2pt}.wb-rating span{padding:.7mm}.wb-footer{margin-top:1.5mm;font-size:5.8pt}}
</style>
<script src="ib-sehs-data.js?v=1"></script>
</head>
<body class="mode-both">
<div class="wb-bar"><div class="wb-brand"><strong>IB SEHS Visual Revision Workbook</strong><span>First assessment 2026 · SL + HL</span></div><div class="wb-mode" aria-label="Workbook language"><button class="active" type="button" data-mode="both">Both</button><button type="button" data-mode="en">EN</button><button type="button" data-mode="zh">中文</button></div><a class="wb-btn" href="ib-sehs.html">Back to prep</a><button class="wb-btn primary" id="printBtn" type="button">Print / Save PDF</button></div>
<div class="wb-intro"><div class="wb-intro-card"><h1>29 visual topic sheets</h1><p>Use this as a retrieval workbook, not another textbook. Read one sheet, close it, explain the concept, then return only if the check fails.</p><div class="wb-stats"><span class="wb-stat">29 topics</span><span class="wb-stat">3 themes</span><span class="wb-stat">SL + HL</span><span class="wb-stat">Bilingual</span><span class="wb-stat">Print-friendly</span></div></div></div>
<main class="wb-book" id="workbook"></main>
<script>
(function(){
'use strict';
var topics=window.IBSEHS_TOPICS||[];var book=document.getElementById('workbook');
function make(tag,cls,value){var n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n}
function color(theme){return theme==='A'?'#b4232f':theme==='B'?'#215ea4':'#24745a'}
function render(){
book.textContent='';
topics.forEach(function(topic){
var sheet=make('article','wb-sheet');sheet.style.setProperty('--theme',color(topic.theme));
var head=make('div','wb-sheet-head');var theme=make('div','wb-theme',topic.theme);var title=make('div','wb-title');var h2=make('h2','',topic.en);var p=make('p','',topic.zh);title.appendChild(h2);title.appendChild(p);var code=make('div','wb-code');code.appendChild(make('strong','',topic.code));code.appendChild(make('span','',topic.hl?'Additional HL focus':'SL + HL core'));head.appendChild(theme);head.appendChild(title);head.appendChild(code);sheet.appendChild(head);
var label=make('div','wb-section-label','MUST KNOW · 必会');sheet.appendChild(label);var ess=make('div','wb-ess');topic.ess.forEach(function(item){var row=make('div','wb-ess-row');row.appendChild(make('div','wb-ess-en',item[0]));row.appendChild(make('div','wb-ess-zh',item[1]));ess.appendChild(row)});sheet.appendChild(ess);
var bottom=make('div','wb-bottom');var skip=make('div','wb-box warn');skip.appendChild(make('h3','','DO NOT OVERLEARN · 无需过度学习'));var skipText=make('p');skipText.appendChild(make('span','wb-en',topic.skip[0]));skipText.appendChild(document.createElement('br'));skipText.appendChild(make('span','wb-zh',topic.skip[1]));skip.appendChild(skipText);bottom.appendChild(skip);
var exam=make('div','wb-box');exam.appendChild(make('h3','','EXAM MOVE · 考试动作'));var examText=make('p');examText.appendChild(make('span','wb-en',topic.cmd+'. '+topic.check[0]));examText.appendChild(document.createElement('br'));examText.appendChild(make('span','wb-zh',topic.cmd+'。'+topic.check[1]));exam.appendChild(examText);bottom.appendChild(exam);sheet.appendChild(bottom);
var check=make('div','wb-check');check.appendChild(make('strong','','RETRIEVAL CHECK · 提取检查 '));check.appendChild(make('span','wb-en',topic.check[0]));check.appendChild(document.createElement('br'));check.appendChild(make('span','wb-zh',topic.check[1]));sheet.appendChild(check);
var rating=make('div','wb-rating');rating.appendChild(make('span','','SELF-RATING · 自评'));rating.appendChild(make('span','','Can explain · 能解释'));rating.appendChild(make('span','','Can compare · 能比较'));rating.appendChild(make('span','','Can apply · 能应用'));sheet.appendChild(rating);
var footer=make('div','wb-footer');footer.appendChild(make('span','','Vitalité original visual summary · 基于官方课程指南的原创精简总结'));footer.appendChild(make('span','','Stop when the sheet is secure · 掌握后停止重复'));sheet.appendChild(footer);book.appendChild(sheet);
});
}
document.querySelectorAll('[data-mode]').forEach(function(btn){btn.addEventListener('click',function(){document.body.className='mode-'+btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(function(b){b.classList.toggle('active',b===btn)})})});
document.getElementById('printBtn').addEventListener('click',function(){window.print()});
render();
if(location.hash==='#print')setTimeout(function(){window.print()},700);
})();
</script>
</body>
</html>
